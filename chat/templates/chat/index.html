<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'chat/style.css' %}">
</head>

<body>

    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Login Screen -->
    <div id="login-screen">
        <div class="login-card glass">
            <div class="login-header">
                <h1>AI Chatbot Portal</h1>
                <p style="color:var(--text-muted); margin-top:0.5rem">Select your role to continue</p>
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchLoginTab('employee', this)">Employee</button>
                <button class="tab-btn" onclick="switchLoginTab('manager', this)">Manager</button>
            </div>

            <div id="employee-login-form">
                <div class="input-group">
                    <label>Corporate Email</label>
                    <input type="email" id="employee-email" placeholder="name@company.com">
                </div>
                <button class="btn-primary" onclick="handleLogin('employee')">Login as Employee</button>
            </div>

            <div id="manager-login-form" class="hidden">
                <div class="input-group">
                    <label>Manager Email</label>
                    <input type="email" id="manager-email" placeholder="manager@company.com">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="manager-password" placeholder="••••••••">
                </div>
                <button class="btn-primary" onclick="handleLogin('manager')">Login as Manager</button>
            </div>
        </div>
    </div>

    <!-- Main App Shell -->
    <div id="app-shell" class="hidden">
        <aside class="glass">
            <div style="margin-bottom: 2.5rem;">
                <h2 style="font-size: 1.2rem; color: var(--accent); font-weight: 700;">HR AI PORTAL</h2>
            </div>

            <nav style="flex: 1;">
                <div class="nav-item active" data-tab="chat" onclick="switchTab('chat')">
                    <span>💬</span> Chat Assistant
                </div>
                <div class="nav-item manager-only hidden" data-tab="leaves" onclick="switchTab('leaves')">
                    <span>📅</span> My Leave Requests
                </div>
                <div class="nav-item manager-only hidden" data-tab="manager-leaves"
                    onclick="switchTab('manager-leaves')">
                    <span>⚖️</span> Review Leaves
                </div>
            </nav>

            <div style="padding-top: 2rem; border-top: 1px solid var(--glass-border);">
                <div id="user-info" style="margin-bottom: 1rem;">
                    <p id="user-email" style="font-size: 0.85rem; font-weight: 600;"></p>
                    <span id="user-role-badge" class="status-badge status-Pending"
                        style="font-size: 0.7rem; padding: 0.2rem 0.5rem;"></span>
                </div>
                <button onclick="logout()"
                    style="background:transparent; border:none; color:var(--danger); cursor:pointer; font-size:0.9rem; font-weight:600;">
                    🚪 Logout
                </button>
            </div>
        </aside>

        <main id="content-area">
            <!-- Dynamic Content Load Injection -->
        </main>
    </div>

    <script src="{% static 'chat/app.js' %}"></script>
    <script>
        function switchLoginTab(role, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            document.getElementById('employee-login-form').classList.toggle('hidden', role !== 'employee');
            document.getElementById('manager-login-form').classList.toggle('hidden', role !== 'manager');
        }
    </script>
</body>

</html>
