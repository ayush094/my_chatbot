<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <style>
        :root {
            --primary-color: #0f172a;
            --secondary-color: #1e293b;
            --accent-color: #3b82f6;
            --text-color: #e2e8f0;
            --user-msg-bg: #3b82f6;
            --ai-msg-bg: #334155;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--primary-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            background-color: var(--secondary-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border-radius: 0.5rem;
            margin: 1rem;
            overflow: hidden;
        }

        header {
            padding: 1rem;
            background-color: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #334155;
            text-align: center;
            font-weight: 600;
            font-size: 1.25rem;
        }

        #chat-history {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            line-height: 1.5;
            position: relative;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--user-msg-bg);
            border-bottom-right-radius: 0.25rem;
        }

        .message.ai {
            align-self: flex-start;
            background-color: var(--ai-msg-bg);
            border-bottom-left-radius: 0.25rem;
        }

        .timestamp {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-top: 0.25rem;
            text-align: right;
            display: block;
        }

        .input-area {
            padding: 1rem;
            background-color: var(--secondary-color);
            border-top: 1px solid #334155;
            display: flex;
            gap: 0.5rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: white;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        button {
            padding: 0.75rem 1.5rem;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #2563eb;
        }

        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }

        .loading {
            display: flex;
            gap: 0.25rem;
            align-items: center;
            padding: 0.5rem;
            align-self: flex-start;
            font-size: 0.9rem;
            color: #94a3b8;
            font-style: italic;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #94a3b8;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }

        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>

<body>
    <div class="chat-container">
        <header>
            Ayush's AI Bot
        </header>
        <div id="chat-history">
            <!-- Messages will appear here -->
            <div class="message ai">
                Hello! I am your technical assistant. How can I help you today?
            </div>
        </div>
        <form id="chat-form" class="input-area">
            <input type="text" id="user-input" placeholder="Type your message..." required autocomplete="off">
            <button type="submit" id="send-btn">Send</button>
        </form>
    </div>

    <script>
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatHistory = document.getElementById('chat-history');
        const sendBtn = document.getElementById('send-btn');

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);

            // Allow basic markdown-like newline rendering
            const content = text.replace(/\n/g, '<br>');
            msgDiv.innerHTML = content;

            chatHistory.appendChild(msgDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function showLoading() {
            const loader = document.createElement('div');
            loader.id = 'loader';
            loader.classList.add('loading');
            loader.innerHTML = `
                <span>Thinking</span>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            `;
            chatHistory.appendChild(loader);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function hideLoading() {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.remove();
            }
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            // Disable input
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;

            // Add user message to UI
            appendMessage(message, 'user');

            // Show loading
            showLoading();

            try {
                const response = await fetch('/api/chat/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                hideLoading();

                if (response.ok) {
                    appendMessage(data.answer, 'ai');
                } else {
                    let errorMessage = "Error: " + (data.error || data.answer || "Something went wrong");
                    if (data.debug_info) {
                        errorMessage += "<br><small style='color: #f87171; display: block; margin-top: 5px; font-family: monospace;'>Debug: " + data.debug_info.substring(0, 200) + "...</small>";
                    }
                    appendMessage(errorMessage, 'ai');
                }

            } catch (error) {
                hideLoading();
                appendMessage("Network Error: " + error.message, 'ai');
            } finally {
                // Re-enable input
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        });
    </script>
</body>

</html>
